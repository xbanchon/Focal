server:
  port: 8080

spring:
  application:
    name: image-metadata-service

  datasource:
    url: jdbc:postgresql://localhost:5432/image_metadata
    username: admin
    password: password123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: password123