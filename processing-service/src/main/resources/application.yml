spring:
  application:
    name: processing-service

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: password123
    listener:
      simple:
        retry:
          enabled: true
          # Try 3 times total before giving up
          max-retries: 3
          # Wait 3 seconds after the first failure
          initial-interval: 3s
          # Double the wait time after each failure (3s -> 6s -> give up)
          multiplier: 2.0
          max-interval: 10s

  main:
    web-application-type: none