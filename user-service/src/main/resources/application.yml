server:
  port: ${USER_MICROSERVICE_PORT}

spring:
  application:
    name: user-service

  datasource:
    url: ${POSTGRES_URL}/identity_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS}

google:
  client-id: ${GOOGLE_CLIENT_ID}